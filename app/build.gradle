plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fanremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.fanremote'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// Intentionally no dependencies: plain Android framework only (fast, tiny APK).
dependencies {
}
